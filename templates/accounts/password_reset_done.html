{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email Sent | Business Assistant</title>

{% include 'base/header.html' %}

<style>

:root{
    --primary:#6366f1;
    --primary-dark:#4f46e5;

    --bg-main:#020617;
    --bg-card:#0f172a;

    --border:rgba(255,255,255,0.08);

    --text-main:#f8fafc;
    --text-muted:#94a3b8;
}

body{
    margin:0;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at top right,
        rgba(99,102,241,0.16),
        transparent 30%),

        radial-gradient(circle at bottom left,
        rgba(59,130,246,0.12),
        transparent 25%),

        linear-gradient(
            135deg,
            #020617,
            #0f172a
        );

    font-family:'Inter',sans-serif;
}

.auth-card{
    width:100%;
    max-width:460px;

    background:rgba(15,23,42,0.92);

    border:1px solid var(--border);

    border-radius:28px;

    padding:45px;

    text-align:center;

    box-shadow:
        0 25px 60px rgba(0,0,0,0.45);

    animation:fadeUp .5s ease;
}

.brand-mark{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    margin-bottom:26px;
}

.brand-icon{
    width:38px;
    height:38px;

    border-radius:12px;

    background:linear-gradient(135deg,var(--primary),var(--primary-dark));

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:15px;

    box-shadow:0 8px 20px rgba(99,102,241,0.35);
}

.brand-text{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.2;
}

.brand-name{
    font-weight:800;
    font-size:14px;
    color:var(--text-main);
}

.brand-tagline{
    font-size:10px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.5px;
}

.state-icon{
    width:90px;
    height:90px;

    margin:auto auto 24px;

    border-radius:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );

    color:#fff;

    font-size:36px;
}

.state-title{
    color:#fff;
    font-size:28px;
    font-weight:800;

    margin-bottom:10px;
}

.state-text{
    color:var(--text-muted);

    line-height:1.8;

    margin-bottom:26px;
}

.state-footer a{
    color:#c7d2fe;
    text-decoration:none;
    font-size:14px;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="auth-card">

    <div class="brand-mark">
        <div class="brand-icon"><i class="fas fa-gem"></i></div>
        <div class="brand-text">
            <span class="brand-name">Business Assistant</span>
            <span class="brand-tagline">Smart ERP Platform</span>
        </div>
    </div>

    <div class="state-icon">
        <i class="fas fa-envelope"></i>
    </div>

    <div class="state-title">
        Email Sent
    </div>

    <div class="state-text">
        Password reset instructions have been sent to your email address.
    </div>

    <div class="state-footer">
        <a href="{% url 'user-login' %}">
            ← Back to Login
        </a>
    </div>

</div>

{% include 'base/js.html' %}
</body>
</html>
